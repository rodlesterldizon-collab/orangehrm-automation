name: OrangeHRM Automated Test Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      screenshot:
        description: 'Playwright Screenshot Mode'
        required: false
        default: 'only-on-failure'
        type: choice
        options:
          - 'only-on-failure'
          - 'on'
          - 'off'
      trace:
        description: 'Playwright Trace Mode'
        required: false
        default: 'retain-on-failure'
        type: choice
        options:
          - 'retain-on-failure'
          - 'on-first-retry'
          - 'on'
          - 'off'

env:
  CI: "true"
  PLAYWRIGHT_SCREENSHOT: ${{ inputs.screenshot || 'only-on-failure' }}
  PLAYWRIGHT_TRACE: ${{ inputs.trace || 'retain-on-failure' }}

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Job 1: REST API Contract & AJV Schema Suite
  # ─────────────────────────────────────────────────────────────────
  api-tests:
    name: "API & Schema Contract Tests"
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rodlesterldizon-collab/core-test-suite/test-runner:v1.62.1
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.CR_PAT || secrets.GITHUB_TOKEN }}
      options: --ipc=host
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Project Dependencies
        run: npm ci || npm install

      - name: Configure Secure Environment from GitHub Secrets
        env:
          SECRET_BASE_URL: ${{ secrets.BASE_URL }}
          SECRET_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          SECRET_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          cp .env.example .env
          if [ -n "$SECRET_BASE_URL" ]; then echo "BASE_URL=$SECRET_BASE_URL" >> .env; fi
          if [ -n "$SECRET_USERNAME" ]; then echo "ADMIN_USERNAME=$SECRET_USERNAME" >> .env; fi
          if [ -n "$SECRET_PASSWORD" ]; then echo "ADMIN_PASSWORD=$SECRET_PASSWORD" >> .env; fi
          echo "CI=true" >> .env

      - name: Run API Tests & AJV Schema Suite
        run: npm run test:api

      - name: Publish API Test Run Summary
        if: always()
        run: |
          echo "### 🌐 REST API & AJV Schema Test Run" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Container Image** | \`ghcr.io/rodlesterldizon-collab/core-test-suite/test-runner:v1.62.1\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Suite** | \`tests/api/\` (Auth, PIM, Admin, Directory, Schema) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Schema Engine** | AJV JSON Schema Draft-07/2020-12 |" >> $GITHUB_STEP_SUMMARY
          echo "| **IPC Mode** | \`--ipc=host\` |" >> $GITHUB_STEP_SUMMARY

      - name: Upload API HTML Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-api
          path: playwright-report/
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────
  # Job 2: Desktop E2E (Chrome)
  # ─────────────────────────────────────────────────────────────────
  desktop-e2e:
    name: "Desktop E2E (Chrome)"
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rodlesterldizon-collab/core-test-suite/test-runner:v1.62.1
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.CR_PAT || secrets.GITHUB_TOKEN }}
      options: --ipc=host
    timeout-minutes: 25
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Project Dependencies
        run: npm ci || npm install

      - name: Configure Secure Environment from GitHub Secrets
        env:
          SECRET_BASE_URL: ${{ secrets.BASE_URL }}
          SECRET_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          SECRET_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          CFG_SCREENSHOT: ${{ env.PLAYWRIGHT_SCREENSHOT }}
          CFG_TRACE: ${{ env.PLAYWRIGHT_TRACE }}
        run: |
          cp .env.example .env
          if [ -n "$SECRET_BASE_URL" ]; then echo "BASE_URL=$SECRET_BASE_URL" >> .env; fi
          if [ -n "$SECRET_USERNAME" ]; then echo "ADMIN_USERNAME=$SECRET_USERNAME" >> .env; fi
          if [ -n "$SECRET_PASSWORD" ]; then echo "ADMIN_PASSWORD=$SECRET_PASSWORD" >> .env; fi
          echo "PLAYWRIGHT_SCREENSHOT=$CFG_SCREENSHOT" >> .env
          echo "PLAYWRIGHT_TRACE=$CFG_TRACE" >> .env
          echo "CI=true" >> .env

      - name: Run Desktop E2E Tests (Chrome)
        run: npm run test:desktop

      - name: Run Locator Self-Healer & Resilience Audit
        if: always()
        run: npm run test:heal

      - name: Publish Desktop Test Run Summary
        if: always()
        run: |
          echo "### 🖥️ Desktop E2E Regression Run" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Container Image** | \`ghcr.io/rodlesterldizon-collab/core-test-suite/test-runner:v1.62.1\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Browser Tested** | Google Chrome / Chromium |" >> $GITHUB_STEP_SUMMARY
          echo "| **Resolution** | 1280x720 (Desktop Viewport) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Screenshots Mode** | \`${{ env.PLAYWRIGHT_SCREENSHOT }}\` (captured only on failure) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Trace Mode** | \`${{ env.PLAYWRIGHT_TRACE }}\` (retained only on failure) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Artifact** | Download \`playwright-report-desktop\` for failure screenshots, traces & HTML report |" >> $GITHUB_STEP_SUMMARY

      - name: Upload Desktop HTML Test Report, Traces & Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-desktop
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────
  # Job 3: Tablet Responsive E2E Suite (iPad 768x1024)
  # ─────────────────────────────────────────────────────────────────
  tablet-e2e:
    name: "Tablet Responsive E2E (iPad @tablet)"
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rodlesterldizon-collab/core-test-suite/test-runner:v1.62.1
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.CR_PAT || secrets.GITHUB_TOKEN }}
      options: --ipc=host
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Project Dependencies
        run: npm ci || npm install

      - name: Configure Secure Environment from GitHub Secrets
        env:
          SECRET_BASE_URL: ${{ secrets.BASE_URL }}
          SECRET_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          SECRET_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          CFG_SCREENSHOT: ${{ env.PLAYWRIGHT_SCREENSHOT }}
          CFG_TRACE: ${{ env.PLAYWRIGHT_TRACE }}
        run: |
          cp .env.example .env
          if [ -n "$SECRET_BASE_URL" ]; then echo "BASE_URL=$SECRET_BASE_URL" >> .env; fi
          if [ -n "$SECRET_USERNAME" ]; then echo "ADMIN_USERNAME=$SECRET_USERNAME" >> .env; fi
          if [ -n "$SECRET_PASSWORD" ]; then echo "ADMIN_PASSWORD=$SECRET_PASSWORD" >> .env; fi
          echo "PLAYWRIGHT_SCREENSHOT=$CFG_SCREENSHOT" >> .env
          echo "PLAYWRIGHT_TRACE=$CFG_TRACE" >> .env
          echo "CI=true" >> .env

      - name: Run Tablet Responsive Tests
        run: npm run test:tablet

      - name: Publish Tablet Test Run Summary
        if: always()
        run: |
          echo "### 📱 Tablet Responsive E2E Run" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Container Image** | \`ghcr.io/rodlesterldizon-collab/core-test-suite/test-runner:v1.62.1\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Device Profile** | iPad (9th/8th/mini/5th/older) · 768x1024 |" >> $GITHUB_STEP_SUMMARY
          echo "| **Target Tag** | \`@tablet\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Screenshots Mode** | \`${{ env.PLAYWRIGHT_SCREENSHOT }}\` (captured only on failure) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Trace Mode** | \`${{ env.PLAYWRIGHT_TRACE }}\` (retained only on failure) |" >> $GITHUB_STEP_SUMMARY

      - name: Upload Tablet HTML Test Report, Traces & Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-tablet
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────
  # Job 4: Mobile Responsive E2E Suite (Pixel 7 393x851)
  # ─────────────────────────────────────────────────────────────────
  mobile-e2e:
    name: "Mobile Responsive E2E (Pixel 7 @mobile)"
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rodlesterldizon-collab/core-test-suite/test-runner:v1.62.1
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.CR_PAT || secrets.GITHUB_TOKEN }}
      options: --ipc=host
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Project Dependencies
        run: npm ci || npm install

      - name: Configure Secure Environment from GitHub Secrets
        env:
          SECRET_BASE_URL: ${{ secrets.BASE_URL }}
          SECRET_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          SECRET_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          CFG_SCREENSHOT: ${{ env.PLAYWRIGHT_SCREENSHOT }}
          CFG_TRACE: ${{ env.PLAYWRIGHT_TRACE }}
        run: |
          cp .env.example .env
          if [ -n "$SECRET_BASE_URL" ]; then echo "BASE_URL=$SECRET_BASE_URL" >> .env; fi
          if [ -n "$SECRET_USERNAME" ]; then echo "ADMIN_USERNAME=$SECRET_USERNAME" >> .env; fi
          if [ -n "$SECRET_PASSWORD" ]; then echo "ADMIN_PASSWORD=$SECRET_PASSWORD" >> .env; fi
          echo "PLAYWRIGHT_SCREENSHOT=$CFG_SCREENSHOT" >> .env
          echo "PLAYWRIGHT_TRACE=$CFG_TRACE" >> .env
          echo "CI=true" >> .env

      - name: Run Mobile Responsive Tests
        run: npm run test:mobile

      - name: Publish Mobile Test Run Summary
        if: always()
        run: |
          echo "### 📱 Mobile Responsive E2E Run" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Container Image** | \`ghcr.io/rodlesterldizon-collab/core-test-suite/test-runner:v1.62.1\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Device Profile** | Google Pixel 7 · 393x851 (Mobile Emulation) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Target Tag** | \`@mobile\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Screenshots Mode** | \`${{ env.PLAYWRIGHT_SCREENSHOT }}\` (captured only on failure) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Trace Mode** | \`${{ env.PLAYWRIGHT_TRACE }}\` (retained only on failure) |" >> $GITHUB_STEP_SUMMARY

      - name: Upload Mobile HTML Test Report, Traces & Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-mobile
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────
  # Job 5: Consolidated Pipeline Reporting & QA Executive Summary
  # ─────────────────────────────────────────────────────────────────
  qa-pipeline-reporting:
    name: "Pipeline QA Executive Summary"
    runs-on: ubuntu-latest
    needs: [api-tests, desktop-e2e, tablet-e2e, mobile-e2e]
    if: always()
    steps:
      - name: Generate Consolidated Executive Summary
        run: |
          echo "## 📊 OrangeHRM Automated Test Pipeline Execution Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job / Test Suite | Device / Environment | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **REST API & Schema Suite** | Headless Node.js · AJV Engine | ${{ needs.api-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Desktop Cross-Browser E2E** | Chromium, MS Edge, WebKit (Safari) | ${{ needs.desktop-e2e.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tablet Responsive E2E** | Apple iPad (768x1024) | ${{ needs.tablet-e2e.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Mobile Responsive E2E** | Google Pixel 7 (393x851) | ${{ needs.mobile-e2e.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📸 Trace & Screenshot Configuration" >> $GITHUB_STEP_SUMMARY
          echo "| Setting | Value | Description |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **PLAYWRIGHT_SCREENSHOT** | \`${{ env.PLAYWRIGHT_SCREENSHOT }}\` | Screenshots saved ONLY when a test fails |" >> $GITHUB_STEP_SUMMARY
          echo "| **PLAYWRIGHT_TRACE** | \`${{ env.PLAYWRIGHT_TRACE }}\` | Traces retained and saved ONLY when a test fails |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 How to Find & View Failure Outputs in GitHub Actions" >> $GITHUB_STEP_SUMMARY
          echo "1. **Locate Artifacts**:" >> $GITHUB_STEP_SUMMARY
          echo "   - Click on the **Summary** tab on the left sidebar of this GitHub Actions run." >> $GITHUB_STEP_SUMMARY
          echo "   - Scroll down to the **Artifacts** table at the bottom of the page." >> $GITHUB_STEP_SUMMARY
          echo "   - Download any report package containing failed test diagnostics:" >> $GITHUB_STEP_SUMMARY
          echo "     - \`playwright-report-desktop\`" >> $GITHUB_STEP_SUMMARY
          echo "     - \`playwright-report-tablet\`" >> $GITHUB_STEP_SUMMARY
          echo "     - \`playwright-report-mobile\`" >> $GITHUB_STEP_SUMMARY
          echo "     - \`playwright-report-api\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "2. **View Interactive Failure Traces (Zero Setup)**:" >> $GITHUB_STEP_SUMMARY
          echo "   - Extract the downloaded ZIP." >> $GITHUB_STEP_SUMMARY
          echo "   - Look inside the extracted \`test-results/\` directory for any failed test folder containing \`trace.zip\`." >> $GITHUB_STEP_SUMMARY
          echo "   - Open **[https://trace.playwright.dev](https://trace.playwright.dev)** in your browser and drag-and-drop the \`trace.zip\` file." >> $GITHUB_STEP_SUMMARY
          echo "   - You can step through exact DOM snapshots, network payloads, console errors, and the failure point." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "3. **View HTML Reports & Failure Screenshots Locally**:" >> $GITHUB_STEP_SUMMARY
          echo "   - Inside the extracted folder, open \`index.html\` or run:" >> $GITHUB_STEP_SUMMARY
          echo "     \`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "     npx playwright show-report <extracted-folder>" >> $GITHUB_STEP_SUMMARY
          echo "     \`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "   - Any failed tests will have the failure screenshot and trace link attached directly to the test details card." >> $GITHUB_STEP_SUMMARY
